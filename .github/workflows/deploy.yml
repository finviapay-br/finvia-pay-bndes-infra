name: Deploy Infrastructure

on:
  push:
    branches:
      - main
      - hlg
      - dev
    paths:
      - 'infra/**'

  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy (dev, hlg, prod)'
        required: true
        default: 'dev'
      full_deploy:
        description: 'Deploy all stacks'
        required: false
        default: 'false'

jobs:

  set-stage:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event.inputs.stage }}" != "" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "stage=prod" >> $GITHUB_OUTPUT
          else
            echo "stage=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      data_changed: ${{ steps.changed-files.outputs.any_changed }}
      data_dirs: ${{ steps.changed-dirs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect auth changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'infra/auth/**'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            infra/data/**

      - name: Extract changed data directories
        id: changed-dirs
        run: |
          DIRS=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep '^infra/data/' | cut -d/ -f1-3 | sort -u)

          if [ -z "$DIRS" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            JSON=$(printf '%s\n' $DIRS | jq -R . | jq -cs .)
            echo "matrix=$JSON" >> $GITHUB_OUTPUT
          fi

  deploy-data:
    needs: [set-stage, detect-changes]
    if: needs.detect-changes.outputs.data_changed == 'true' || github.event.inputs.full_deploy == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changes.outputs.data_dirs || '[]') }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Install Serverless
        run: npm install -g serverless@3.38.0

      - name: Deploy changed data stack
        run: |
          echo "Deploying ${{ matrix.dir }}"
          cd ${{ matrix.dir }}
          serverless deploy --stage ${{ needs.set-stage.outputs.stage }}

  deploy-auth:
    needs: [set-stage, detect-changes]
    if: needs.detect-changes.outputs.auth == 'true' || github.event.inputs.full_deploy == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Install dependencies
        run: npm install
        working-directory: infra/auth

      - name: Install Serverless
        run: npm install -g serverless@3.38.0

      - name: Deploy Auth Stack
        run: |
          cd infra/auth
          serverless deploy --stage ${{ needs.set-stage.outputs.stage }}