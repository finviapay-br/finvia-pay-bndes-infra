service: dynamo-organization

provider:
  name: aws
  region: sa-east-1
  stage: ${opt:stage, 'dev'}

custom:
  tableName: organization-${self:provider.stage}

resources:
  Resources:
    OrganizationTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S

          - AttributeName: branchCnpj
            AttributeType: S
          - AttributeName: companyId
            AttributeType: S
          - AttributeName: role
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:
          - IndexName: branch-cnpj-index
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: branchCnpj
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: company-role-index
            KeySchema:
              - AttributeName: companyId
                KeyType: HASH
              - AttributeName: role
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: GSI2-User-Branch
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        SSESpecification:
          SSEEnabled: true

  Outputs:
    OrganizationTableName:
      Value: ${self:custom.tableName}
    
    